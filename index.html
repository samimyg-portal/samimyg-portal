<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samimyg Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 { color: #facc15; margin-bottom: 10px; }
        p { font-size: 16px; color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Samimyg Portal</h1>
        <p>স্বাগতম! আমাদের ওয়েব অ্যাপটি সফলভাবে চালু হয়েছে।</p>
    </div>
</body>
</html>
